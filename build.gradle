plugins {
    id "io.spring.dependency-management" version "1.1.7"
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
    id "com.github.node-gradle.node" version "7.1.0"
}

project.ext {
    publishRepo = "https://maven.pkg.github.com/reportportal/plugin-mobitru"
    dependencyRepos = ["plugin-api", "commons-bom"]
    releaseMode = project.hasProperty("releaseMode")
    pluginID = "mobitru"
    pluginsDir = layout.buildDirectory.dir("plugins").get().asFile.path
}

def scriptsUrl = 'https://raw.githubusercontent.com/reportportal/gradle-scripts/' +
        (releaseMode ? getProperty('scripts.version') : 'develop')

apply from: scriptsUrl + '/release-fat.gradle'
apply from: scriptsUrl + '/signing.gradle'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven { url = "https://build.shibboleth.net/nexus/content/repositories/releases/" }
    if (!releaseMode) {
        maven { url = 'https://jitpack.io' }
    }
}

ext['spring-boot.version'] = "${springBootVersion}"

dependencies {
    if (releaseMode) {
        implementation 'com.epam.reportportal:service-api'
        annotationProcessor('com.epam.reportportal:service-api') {
            exclude group: 'org.springframework.modulith', module: 'spring-modulith-apt'
        }
    } else {
        implementation 'com.github.reportportal:service-api:e6a3e1a7e0'
        annotationProcessor('com.github.reportportal:service-api:e6a3e1a7e0') {
            exclude group: 'org.springframework.modulith', module: 'spring-modulith-apt'
        }
    }
    implementation "org.springframework.boot:spring-boot-starter-web:${springBootVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

test {
    useJUnitPlatform()
}

node {
    version = '20.19.5'
    npmVersion = '11.6.4'
    download = true
    nodeProjectDir = file("${project.rootDir}/ui")
}

npmInstall {
    args = ['--legacy-peer-deps']
}

npm_run_build {
    inputs.files fileTree('ui/src')
    inputs.file 'ui/package.json'
    outputs.dir 'ui/build'
}

jar.dependsOn npm_run_build

assemble.dependsOn shadowJar

generatePomFileForShadowPublication { pom.packaging = "jar" }

jar {
    from('ui/build') {
        into('/resources')
    }
    manifest {
        attributes(
                "Class-Path": configurations.compileClasspath.collect { it.getName() }.join(' '),
                "Plugin-Id": "${pluginId}",
                "Plugin-Version": "${project.version}",
                "Plugin-Provider": "reportportal.io",
                "Plugin-Class": "com.epam.reportportal.mobitru.MobitruPlugin",
                "Plugin-Name": "${pluginName}",
                "Plugin-Description": "${description}",
                "Plugin-Documentation": "${documentation}",
                "Plugin-Binary-Data-main": "${mainBinaryData}",
                "Plugin-Binary-Data-metadata": "${metadataBinaryData}",
                "Plugin-Binary-Data-icon": "${iconBinaryData}",
                "Plugin-Metadata-isIntegrationsAllowed": "${isIntegrationsAllowed}",
        )
    }
}

shadowJar {
    zip64 = true
    dependencies {
    }
}

task plugin(type: Jar) {
    getArchiveBaseName().set("plugin-${pluginId}")
    into('classes') {
        with jar
    }
    into('lib') {
        from configurations.compileClasspath
    }
    archiveExtension.set('zip')
}

task assemblePlugin(type: Copy) {
    from plugin
    into pluginsDir
}

task assemblePlugins(type: Copy) {
    dependsOn subprojects.assemblePlugin
}

wrapper {
    gradleVersion = '9.3.1'
}
