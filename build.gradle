plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
    id "com.github.node-gradle.node" version "7.1.0"
    id("io.freefair.lombok") version "9.8.2"
}

version = project.findProperty("version") ?: "1.0.0"

project.ext {
    publishRepo = "https://maven.pkg.github.com/reportportal/plugin-mobitru"
    dependencyRepos = ["plugin-api", "commons-bom"]
    releaseMode = project.hasProperty("releaseMode")
    pluginID = "plugin-other-mobitru"
    pluginsDir = layout.buildDirectory.dir("plugins").get().asFile.path
}

def scriptsUrl = 'https://raw.githubusercontent.com/reportportal/gradle-scripts/' +
        (releaseMode ? getProperty('scripts.version') : 'develop')

apply from: scriptsUrl + '/release-fat.gradle'
apply from: scriptsUrl + '/signing.gradle'

tasks.named('jar') {
    enabled = true
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven { url = "https://build.shibboleth.net/nexus/content/repositories/releases/" }
    if (!releaseMode) {
        maven { url = 'https://jitpack.io' }
    }
}

dependencies {
    if (releaseMode) {
        implementation 'com.epam.reportportal:service-api'
        annotationProcessor('com.epam.reportportal:service-api') {
            exclude group: 'org.springframework.modulith', module: 'spring-modulith-apt'
        }
    } else {
        implementation 'com.github.reportportal:service-api:d4b2f7c'
        annotationProcessor('com.github.reportportal:service-api:d4b2f7c') {
            exclude group: 'org.springframework.modulith', module: 'spring-modulith-apt'
        }
    }

    compileOnly 'tools.jackson.core:jackson-databind'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

node {
    version = '20.19.5'
    npmVersion = '11.6.4'
    download = true
    nodeProjectDir = file("${project.rootDir}/ui")
}

npmInstall {
    args = ['--legacy-peer-deps']
}

npm_run_build {
    inputs.files fileTree('ui/src')
    inputs.file 'ui/package.json'
    outputs.dir 'ui/build'
}

jar.dependsOn npm_run_build

assemble.dependsOn shadowJar

generatePomFileForShadowPublication { pom.packaging = "jar" }

tasks.register('generateMarketplaceManifest') {
    def outputDir = layout.buildDirectory.dir('generated/marketplace')
    def manifest = [
            id           : pluginId.toString().trim(),
            name         : pluginName.toString().trim(),
            version      : project.version.toString(),
            description  : project.description.toString().trim(),
            author       : [name: 'EPAM ReportPortal', email: 'support@reportportal.io'],
            license      : 'Apache-2.0',
            category     : 'other',
            compatibility: [reportportal: '>=25.1'],
            homepage     : 'https://github.com/reportportal/plugin-mobitru',
            access       : 'public',
    ]
    inputs.property('manifest', manifest)
    outputs.dir(outputDir)
    doLast {
        def file = outputDir.get().file('marketplace-manifest.json').asFile
        file.parentFile.mkdirs()
        file.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n', 'UTF-8')
    }
}

jar {
    from(tasks.named('generateMarketplaceManifest'))
    from('ui/build') {
        into('/resources')
    }
    manifest {
        attributes(
                "Class-Path": configurations.compileClasspath.collect { it.getName() }.join(' '),
                "Plugin-Id": "${pluginId}",
                "Plugin-Version": "${project.version}",
                "Plugin-Provider": "reportportal.io",
                "Plugin-Class": "com.epam.reportportal.mobitru.MobitruPlugin",
                "Plugin-Name": "${pluginName}",
                "Plugin-Description": "${project.description}",
                "Plugin-Documentation": "${documentation}",
                "Plugin-Binary-Data-main": "${mainBinaryData}",
                "Plugin-Binary-Data-metadata": "${metadataBinaryData}",
                "Plugin-Binary-Data-icon": "${iconBinaryData}",
                "Plugin-Metadata-isIntegrationsAllowed": "${isIntegrationsAllowed}",
        )
    }
}

shadowJar {
    dependsOn npm_run_build
    archiveClassifier.set('all')
    from('ui/build') {
        into('/resources')
    }
    zip64 = true
    dependencies {
    }
}

def pluginZip = tasks.register('plugin', Jar) {
    archiveBaseName.set("plugin-${pluginId}")
    into('classes') {
        with jar
    }
    into('lib') {
        from configurations.compileClasspath
    }
    archiveExtension.set('zip')
}

tasks.register('assemblePlugin', Copy) {
    from pluginZip
    into pluginsDir
}

tasks.register('assemblePlugins', Copy) {
    dependsOn subprojects.assemblePlugin
}

wrapper {
    gradleVersion = '9.3.1'
}
